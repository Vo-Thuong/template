name: CI/CD Pipeline Fashi Template

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  html-validation:
    name: Check HTML Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code từ GitHub
        uses: actions/checkout@v4

      - name: Setup Node.js để chạy tool test
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài đặt và Chạy HTMLHint
        run: |
          npm install -g htmlhint
          # Thêm index.html vào quét và cấu hình nới lỏng để tránh bắt bẻ template mẫu
          htmlhint "index.html" "shop.html" "shopping-cart.html" --rules "tagname-lowercase=true,attr-lowercase=true,attr-value-not-empty=false,alt-require=false"

  deploy-to-vercel:
    name: Deploy to Vercel
    needs: html-validation
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy lên Cloud Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
