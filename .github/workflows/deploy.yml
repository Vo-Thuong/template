name: CI/CD Pipeline Fashi Template

on:
  push:
    branches:
      - main
      - master  # Tự động chạy khi bạn push code lên nhánh main hoặc master
  pull_request:
    branches:
      - main
      - master

jobs:
  # Lớp CI: Tự động quét và kiểm tra lỗi cú pháp HTML
  html-validation:
    name: Check HTML Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code từ GitHub
        uses: actions/checkout@v4

      - name: Setup Node.js để chạy tool test
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài đặt và Chạy HTMLHint
        run: |
          npm install -g htmlhint
          htmlhint "shop.html" "shopping-cart.html"

  # Lớp CD: Tự động deploy lên Vercel nếu bước kiểm tra trên thành công
  deploy-to-vercel:
    name: Deploy to Vercel
    needs: html-validation
    if: github.event_name == 'push' # Chỉ deploy khi push trực tiếp (hoặc merge PR), không deploy khi tạo PR nháp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy lên Cloud Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'